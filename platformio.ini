; Painel de controle da Soundcraft Ui24R
; Placa: ESP32-4848S040C(E) - ESP32-S3, tela 480x480 ST7701 (RGB),
; toque capacitivo GT911. Veja README.md.

[env:esp32-4848S040]
platform = espressif32@6.9.0
board = esp32-s3-devkitm-1
framework = arduino

; O modulo tem 16MB de flash (QIO) e 8MB de PSRAM (OPI) - precisa
; destes overrides porque a definicao "esp32-s3-devkitm-1" generica
; nao assume PSRAM OPI por padrao.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = huge_app.csv

; A placa usa um CH340 (USB-serial) no lugar de USB nativo do S3.
build_flags =
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DWEBSOCKETS_TCP_TIMEOUT=400
    -I include

lib_deps =
    moononournation/GFX Library for Arduino@1.4.7
    lvgl/lvgl@9.6.0
    links2004/WebSockets@2.4.1

monitor_speed = 115200
upload_speed = 921600
